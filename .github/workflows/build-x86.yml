name: Build OpenWrt X86

# X86_64 全功能固件（Intel J1900 / J1800 软路由通用）
# 触发方式：
#   1. 手动触发（Actions 页面 Run workflow）
#   2. 修改 configs/x86.config / files/x86 / 本文件 后 push
#   3. 由 auto-clean-build.yml 每日 03:45/03:50 自动触发
#
# 外部插件说明（其余均用 lede feeds 自带，避免重复冲突）：
#   - passwall2          : Openwrt-Passwall/openwrt-passwall2
#   - passwall 依赖包    : Openwrt-Passwall/openwrt-passwall-packages（去除与 feed 重复的 7 个子包）
#   - 易有云守护进程     : linkease/nas-packages（network/services/linkease + linkease-common-bin）
#   - 易有云界面         : linkease/luci-app-linkease
#   - iStore 商店        : linkease/istore
#   - 全能推送           : zzsj0928/luci-app-pushbot
#   - IP 限速            : sirpdboy/luci-app-eqosplus
#   - ddns-go / lucky / wechatpush / OAF / openlist 等：lede luci/packages feed 已自带，不再外部克隆

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-x86.yml'
      - 'configs/x86.config'
      - 'files/x86/**'

# 公开仓库默认 GITHUB_TOKEN 为只读，这里显式授予 contents 写权限（创建/上传 Release）
permissions:
  contents: write

env:
  LEDE_REPO: https://github.com/coolsnowwolf/lede
  LEDE_BRANCH: master
  FW_CONFIG: configs/x86.config
  OVERLAY_DIR: files/x86
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译 X86_64 全功能固件
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: 检出配置仓库
        uses: actions/checkout@v4

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/local/share/chromium
          sudo apt-get -y autoremove >/dev/null 2>&1 || true
          df -h

      - name: 增加交换分区（防止内存不足）
        run: |
          # runner 自带 /swapfile 且正在使用，先停用并重建
          sudo swapoff /swapfile 2>/dev/null || true
          sudo rm -f /swapfile
          sudo fallocate -l 4G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          free -h

      - name: 安装编译依赖
        run: |
          sudo apt-get update
          sudo apt-get -y install build-essential gcc g++ binutils bzip2 git \
            libncurses5-dev libncursesw5-dev zlib1g-dev gawk gettext automake \
            autoconf libtool libssl-dev rsync flex unzip file python3 python3-pip \
            python3-setuptools python3-yaml swig libxml2-dev libxslt1-dev uuid-runtime \
            wget curl jq gperf cpio time p7zip-full

      - name: 克隆 Lede 源码（Lean 大 OpenWrt）
        run: |
          git clone --depth 1 -b ${{ env.LEDE_BRANCH }} ${{ env.LEDE_REPO }} openwrt
          rm -rf openwrt/.git

      - name: 更新并安装 Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # 释放 feeds 的 .git 空间
          find feeds -name .git -type d -prune -exec rm -rf {} + 2>/dev/null || true

      - name: 修补 OAF 内核模块（兼容 Linux 6.18：del_timer_sync 已移除）
        run: |
          mkdir -p openwrt/feeds/packages/net/open-app-filter/patches
          cp .github/patches/oaf-kernel-6.18-timer.patch openwrt/feeds/packages/net/open-app-filter/patches/

      - name: 添加外部插件
        run: |
          cd openwrt

          # 1. passwall2（仓库内 luci-app-passwall2 为子目录，OpenWrt 会递归扫描 package/）
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall2.git package/luci-app-passwall2

          # 2. passwall/passwall2 依赖包（v2ray-geoip/geosite、ipt2socks、shadowsocks-rust 等）
          #    去除与 lede packages feed 重复的子包：chinadns-ng dns2socks geoview microsocks sing-box tcping xray-core
          git clone --depth 1 https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git package/openwrt-passwall-packages
          rm -rf package/openwrt-passwall-packages/chinadns-ng \
                 package/openwrt-passwall-packages/dns2socks \
                 package/openwrt-passwall-packages/geoview \
                 package/openwrt-passwall-packages/microsocks \
                 package/openwrt-passwall-packages/sing-box \
                 package/openwrt-passwall-packages/tcping \
                 package/openwrt-passwall-packages/xray-core

          # 3. 易有云（luci 界面 + 守护进程二进制，来自 linkease 官方仓库）
          git clone --depth 1 https://github.com/linkease/luci-app-linkease.git package/luci-app-linkease
          git clone --depth 1 https://github.com/linkease/nas-packages.git /tmp/nas-packages
          cp -r /tmp/nas-packages/network/services/linkease package/linkease
          cp -r /tmp/nas-packages/network/services/linkease-common-bin package/linkease-common-bin
          rm -rf /tmp/nas-packages

          # 4. iStore 商店（内含 luci-app-store / luci-lib-taskd / luci-lib-xterm / taskd）
          git clone --depth 1 https://github.com/linkease/istore.git package/istore

          # 5. 全能推送
          git clone --depth 1 https://github.com/zzsj0928/luci-app-pushbot.git package/luci-app-pushbot

          # 6. IP 限速
          git clone --depth 1 https://github.com/sirpdboy/luci-app-eqosplus.git package/luci-app-eqosplus

      - name: 写入自定义系统文件（主机名/IP/密码）
        run: |
          mkdir -p openwrt/files
          cp -r ${{ env.OVERLAY_DIR }}/. openwrt/files/

      - name: 应用固件配置
        run: |
          cp ${{ env.FW_CONFIG }} openwrt/.config
          cd openwrt
          make defconfig

      - name: 下载编译依赖
        run: |
          cd openwrt
          make download -j8 || make download -j1 || { sleep 20; make download -j1 V=s; }

      - name: 编译固件
        run: |
          cd openwrt
          # 并行编译失败后自动降级单线程续编
          make -j$(nproc) V=s || make -j1 V=s

      - name: 整理固件产物
        run: |
          mkdir -p $GITHUB_WORKSPACE/artifact
          cd openwrt/bin/targets/x86
          find . -type f \( \
            -name "*.img.gz" -o -name "*.img" -o -name "*.iso" -o -name "*.tar" \
            -o -name "*.tar.gz" -o -name "*.gz" \
            -o -name "*.vmdk" -o -name "*.qcow2" -o -name "*.vhd" -o -name "*.vhdx" \
            -o -name "*.manifest" -o -name "kernel.bin" \) \
            -exec cp -v {} $GITHUB_WORKSPACE/artifact/ \;

      - name: 创建 Release 并上传固件
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: |
            基于 Lede(Lean OpenWrt 24.10) 云编译，全插件含简体中文包
            适用机型：X86_64（Intel J1900 / J1800 软路由）
            默认管理IP：10.0.1.1   主机名：OpenWRT   用户名：root   密码：password

            内置插件：passwall、passwall2、易有云(luci-app-linkease+守护进程)、iStore商店、全能推送(pushbot)、微信推送(wechatpush)、ddns-go、lucky、OAF行为管理、uhttpd、负载均衡(mwan3)、TTYD、磁盘管理(diskman)、释放内存(ramfree)、Argon主题+设置、自定义命令、Docker(概览/容器/镜像/网络/存储卷/事件/配置)、网络共享(Samba4)、文件列表(OpenList/兼容alist)、流量统计(nlbwmon)、TurboACC(最新BBR)、IP限速(eqosplus)

            1Panel 说明：开源社区暂无 luci-app-1panel 插件，本固件已内置 Docker，
            可在 Docker 中运行 1Panel（官方一键脚本，见仓库 README）。
        run: |
          cd $GITHUB_WORKSPACE/artifact
          if [ -z "$(ls -A .)" ]; then
            echo "::error::未找到固件产物，编译可能失败"
            exit 1
          fi
          TAG="x86-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" ./* \
            --repo "${{ github.repository }}" \
            --title "OpenWrt X86-64 $(date '+%Y-%m-%d %H:%M')" \
            --notes "$NOTES"
