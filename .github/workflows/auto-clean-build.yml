name: 自动清理与构建

# 自动清理 + 自动构建调度
#   03:45（北京时间 = UTC 19:45）: 清理 Release（只保留最近15个）→ 清理成功 → 连锁触发 X86 与 AX3000T 构建
#   03:50（北京时间 = UTC 19:50）: 兜底：检查 03:45 清理流程是否成功
#     - 03:45 清理流程成功（已连锁触发构建）→ 跳过
#     - 03:45 清理流程失败 / 未运行 → 自动触发构建（保证每天都有新固件）
# 说明：GitHub Actions 的 schedule 使用 UTC 时间，03:45/03:50 北京时间对应 19:45/19:50 UTC。

on:
  schedule:
    - cron: '45 19 * * *'   # 北京时间 03:45
    - cron: '50 19 * * *'   # 北京时间 03:50
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup-and-build:
    name: 清理旧Release并连锁构建（03:45）
    if: github.event.schedule == '45 19 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: 清理 Release（只保留最近15个）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          repo="${{ github.repository }}"
          ids=()
          page=1
          while : ; do
            out=$(gh api "repos/$repo/releases?per_page=100&page=$page")
            count=$(echo "$out" | jq 'length')
            [ "$count" = "0" ] && break
            while read -r id; do ids+=("$id"); done < <(echo "$out" | jq -r '.[].id')
            [ "$count" -lt 100 ] && break
            page=$((page + 1))
          done
          total=${#ids[@]}
          echo "当前 Release 数量：$total（接口按最新优先返回）"
          if [ "$total" -le 15 ]; then
            echo "Release 数量 ≤ 15，无需清理"
          else
            echo "需要删除 $((total - 15)) 个旧 Release："
            for ((i = 15; i < total; i++)); do
              echo "  删除 Release id=${ids[$i]}"
              gh api -X DELETE "repos/$repo/releases/${ids[$i]}" >/dev/null || exit 1
            done
          fi

      - name: 清理成功 → 连锁触发构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          gh workflow run build-x86.yml --repo "${{ github.repository }}" --ref main
          gh workflow run build-ax3000t.yml --repo "${{ github.repository }}" --ref main
          echo "已连锁触发：X86 与 小米AX3000T 云编译"

  fallback-build:
    name: 兜底构建（03:50）
    if: github.event.schedule == '50 19 * * *'
    runs-on: ubuntu-latest
    steps:
      - name: 检查 03:45 清理流程结果，未成功则兜底构建
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          repo="${{ github.repository }}"
          now=$(date +%s)
          # 只看最近 12 小时内 auto-clean-build 工作流的 schedule 触发运行
          cutoff=$((now - 43200))
          newest=$(gh api "repos/$repo/actions/runs?workflow=auto-clean-build.yml&per_page=20" \
            | jq -r --argjson c "$cutoff" \
              '[.workflow_runs[] | select(.event == "schedule")
                | select((.created_at | fromdateiso8601) >= $c)]
               | sort_by(.created_at | fromdateiso8601) | reverse | .[0] // empty')
          if [ -z "$newest" ]; then
            echo "未找到今天 03:45 的清理运行（可能被跳过或延迟），执行兜底构建"
            gh workflow run build-x86.yml --repo "${{ github.repository }}" --ref main
            gh workflow run build-ax3000t.yml --repo "${{ github.repository }}" --ref main
            echo "兜底构建已触发"
            exit 0
          fi
          status=$(echo "$newest" | jq -r .status)
          conclusion=$(echo "$newest" | jq -r .conclusion)
          created=$(echo "$newest" | jq -r .created_at)
          echo "最近一次 03:45 清理运行：$created  status=$status conclusion=$conclusion"
          if [ "$status" = "completed" ] && [ "$conclusion" = "success" ]; then
            echo "03:45 清理已成功并连锁触发构建，跳过 03:50 兜底"
          else
            echo "03:45 清理未成功（status=$status conclusion=$conclusion），执行兜底构建"
            gh workflow run build-x86.yml --repo "${{ github.repository }}" --ref main
            gh workflow run build-ax3000t.yml --repo "${{ github.repository }}" --ref main
            echo "兜底构建已触发"
          fi
